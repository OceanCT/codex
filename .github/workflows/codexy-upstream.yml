name: Codexy upstream sync
on:
  schedule:
    - cron: '17 1 * * *'
  workflow_dispatch:
    inputs:
      retry:
        description: 'Retry a previously blocked attempt (also after configuring SMTP)'
        type: boolean
        default: false
      dry_run:
        description: 'Evaluate and report without advancing the Codexy branch'
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: codexy-upstream-sync
  cancel-in-progress: false
jobs:
  sync:
    if: github.repository == 'OceanCT/codex'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    permissions:
      contents: write
      issues: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          path: controller
          persist-credentials: false
          sparse-checkout: |
            scripts/codexy_sync
            .github/workflows
      - name: Check release and previous attempt before fetching history
        id: preflight
        env:
          GH_TOKEN: ${{ github.token }}
          RETRY: ${{ inputs.retry }}
        run: python3 controller/scripts/codexy_sync/preflight.py
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        if: steps.preflight.outputs.proceed == 'true'
        with:
          ref: ${{ steps.preflight.outputs.head }}
          path: candidate
          fetch-depth: 0
          persist-credentials: false
      - name: Test synchronization decisions
        if: steps.preflight.outputs.proceed == 'true'
        run: python3 -m unittest discover -s controller/scripts/codexy_sync -p 'test_*.py' -v
      - name: Prepare next published stable release
        id: prepare
        if: steps.preflight.outputs.proceed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.preflight.outputs.tag }}
        run: python3 controller/scripts/codexy_sync/sync.py prepare --repo candidate --tag "$RELEASE_TAG" --report "$RUNNER_TEMP/report.json"
      - name: Install build and renderer tools
        if: steps.prepare.outputs.status == 'ready' && !inputs.dry_run
        id: setup
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential pkg-config libssl-dev libcap-dev libasound2-dev bubblewrap texlive-latex-extra poppler-utils
          if sysctl -n kernel.apparmor_restrict_unprivileged_userns >/dev/null 2>&1; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      - uses: taiki-e/install-action@44c6d64aa62cd779e873306675c7a58e86d6d532
        if: steps.prepare.outputs.status == 'ready' && !inputs.dry_run
        with:
          tool: just@1.51.0,nextest@0.9.103
      - uses: facebook/install-dotslash@1e4e7b3e07eaca387acb98f1d4720e0bee8dbb6a
        if: steps.prepare.outputs.status == 'ready' && !inputs.dry_run
      - name: Verify sandbox-enabled V8 build artifacts
        if: steps.prepare.outputs.status == 'ready' && !inputs.dry_run
        run: python3 controller/scripts/codexy_sync/setup_v8.py candidate "$RUNNER_TEMP/rusty-v8"
      - name: Build and verify Codexy features
        if: steps.prepare.outputs.status == 'ready' && !inputs.dry_run
        id: validate
        working-directory: candidate
        run: bash ../controller/scripts/codexy_sync/validate.sh
      - name: Publish only the validated unchanged candidate
        if: always() && steps.prepare.outputs.status == 'ready' && !inputs.dry_run
        env:
          GH_TOKEN: ${{ github.token }}
          VALIDATION: ${{ steps.validate.outcome }}
        run: |
          gh auth setup-git
          python3 controller/scripts/codexy_sync/sync.py finish --repo candidate --report "$RUNNER_TEMP/report.json" --validation "$VALIDATION" --publish
      - name: Report conflicts and send email
        if: always() && steps.prepare.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          CODEXY_ATTEMPT_KEY: ${{ steps.preflight.outputs.key }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
        run: python3 controller/scripts/codexy_sync/notify.py "$RUNNER_TEMP/report.json"
      - name: Publish run summary
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/report.md" ]; then cat "$RUNNER_TEMP/report.md" >> "$GITHUB_STEP_SUMMARY"; fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          retention-days: 7
          name: codexy-upstream-report
          path: ${{ runner.temp }}/report.*
          if-no-files-found: ignore
